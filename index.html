<body>
<div class="container">
<h1>My Silly Poem</h1>
<p class="poem">
There once was a cat from Peru,<br />
Who loved to wear a bright blue shoe.<br />
He danced on the roof,<br />
And sang like a goof,<br />
Then slipped and fell into the stew!
</p>
